name: APM build check

# `.github/workflows/` is the only place GitHub Actions reads CI config from —
# this is unrelated to the retired Copilot artifacts (there is no other
# `.github/` content in this repo; see CLAUDE.md).

on:
  pull_request:
  push:
    branches: [master]

jobs:
  pinned:
    name: apm install (pinned version) — must reproduce lockfile exactly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned APM CLI
        run: pip install "apm-cli==0.31.0"
      - name: Guard against BOM before install
        run: |
          if grep -rlIP '\xef\xbb\xbf' .claude/ packages/ 2>/dev/null; then
            echo "::error::UTF-8 BOM found — APM requires --- on line 1, no BOM"
            exit 1
          fi
      - name: Trust lifecycle scripts
        run: apm lifecycle trust
      - name: Install (frozen — must match apm.lock.yaml exactly)
        run: apm install --target claude --frozen
      - name: Audit raw install integrity
        # Must run BEFORE the fix scripts below: they deliberately patch
        # deployed content, which `apm audit` (unaware of them) would
        # otherwise report as drift on every single run.
        #
        # KNOWN ISSUE (CLI v0.31.0, seen repeatedly in local testing): the
        # lockfile's recorded content-integrity hash can go stale relative to
        # the file it just deployed in the SAME install run (verified: source
        # package hash == deployed file hash, both != apm.lock.yaml's
        # "expected" hash) -- a caching bug, not a real content problem. If
        # this step fails only on `content-integrity`/`drift` for files that
        # `git diff` (further down) shows as unchanged, that's this bug, not
        # a real regression -- don't just add `continue-on-error` blindly,
        # confirm first via the git diff step below.
        run: apm audit --ci
      - name: Apply post-install fixes explicitly
        # lifecycle: post-install did not auto-fire in testing (CLI v0.31.0) —
        # see the NOTE above the lifecycle: block in apm.yml. Run explicitly.
        run: |
          python3 scripts/restore-rule-metadata.py
          python3 scripts/fix-cross-package-links.py
      - name: Fail on drift between packages/ and committed .claude/
        # The real acceptance gate: a fresh install + fixup must reproduce
        # the committed tree exactly. This catches both APM regressions and
        # anyone hand-editing .claude/ instead of packages/*/.apm/.
        run: git diff --exit-code -- . ':!.claude/settings.json' ':!.claude/settings.local.json'

  canary:
    name: apm install (latest CLI) — early warning only, never blocks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install latest APM CLI
        run: pip install --upgrade apm-cli
      - name: Trust lifecycle scripts
        run: apm lifecycle trust
      - name: Install (latest — re-resolves refs)
        run: apm install --target claude
      - name: Apply post-install fixes explicitly
        run: |
          python3 scripts/restore-rule-metadata.py
          python3 scripts/fix-cross-package-links.py
      - name: Report drift (informational — does not fail the canary job)
        run: git diff --stat -- . ':!.claude/settings.json' ':!.claude/settings.local.json' || true
