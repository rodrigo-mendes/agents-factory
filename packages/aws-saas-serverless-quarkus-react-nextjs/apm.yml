    - path: ../handoff-core
    - path: ../aws-architect
    - path: ../terraform
    - path: ../stripe-java
    - path: ../openspec-github
    - path: ../solution-architecture
    - path: ../ui-design
    - path: ../nextjs-frontend
    - path: ../quarkus-langchain4j
