# Fixture profile in the OCI style (user-mediated, no spec). Format: blueprints/profile-format.md
profile: oci
protocol: coordinating-agent-handoffs
protocol_version: 1
mode: user-mediated
root: "docs/handoff/{capability}"
scope_key: capability
fallback: none
spec:
  kind: none
roles:
  architect: oci-serverless-architect
  stack: oci-serverless-stack
  java: oci-functions-java
  terraform: oci-terraform
  deployer: oci-deployer
  debugger: oci-debugger
  observability: oci-observability
kind_overrides:
  deploy-report.md: deploy-report
  diagnosis-report.md: diagnosis-report
values:
  work-order:
    status: [pending, in-progress, completed]
required_sections:
  work-order: [Scope, Components, Constraints, Dependencies, Acceptance Criteria]
  report: [What changed, Validation, Acceptance status, Next action]
  deploy-report: [What changed, Validation, Next action]
  diagnosis-report: [Root cause, Evidence, Exact fix, Next action]
limits:
  build_attempts: 3
  deploy_cycles: 2
next:
  - when: {limit_reached: any}
    then: escalate
  - when: {kind: report, role: java, outcome: success}
    then: deployer
  - when: {kind: deploy-report, outcome: failed}
    then: debugger
  - when: {kind: deploy-report, outcome: success}
    then: final-gate
  - when: {kind: diagnosis-report}
    then: deployer
