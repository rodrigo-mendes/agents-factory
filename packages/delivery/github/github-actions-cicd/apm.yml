name: agents-factory-github-actions-cicd
version: 1.0.0
description: >-
  GitHub Actions CI/CD for AWS, OCI and Vercel, as of 2026-10-30: 9 version-locked knowledge skills (reusable-workflow and composite-action building blocks, Terraform 1.17 plan and saved-plan apply, AWS OIDC and OCI login, Java Maven 3.10 / Gradle 9.8, container images, Next.js 16.4, blast-radius limits, supply-chain scanning), the cicd-pipeline-engineer executor and a read-only reviewer agent, 4 scoped workflow rules and the /building-cicd-pipelines command. Plan model - GitHub Pro/Team private repositories are the default; a weaker, explicit Free variant and Enterprise/public upgrade paths are documented. Writes workflow files and runs offline checks only; never triggers pipelines or applies infrastructure.
author: rodrigo-mendes
license: MIT
dependencies:
  apm:
    - path: ../../../factory/factory-core
    - path: ../github-core
  mcp: []
includes: auto
scripts: {}
