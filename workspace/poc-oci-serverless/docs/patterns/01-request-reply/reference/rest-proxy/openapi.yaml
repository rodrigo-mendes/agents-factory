openapi: 3.0.1
info:
  title: Rms Rest Services
  description: Shared services used across the RGBU Enterprise
  version: 25.1.403.0
tags:
- name: DIS APIs
  description: DIS Wrapper Services
- name: FTS
  description: File Transfer Service
paths:
  /services/private/ai/commentsRefinementService:
    post:
      tags:
      - Merch AI Services
      operationId: getRefinedComments
      requestBody:
        content:
          '*/*':
            schema:
              type: string
      responses:
        default:
          description: default response
          content:
            '*/*':
              schema:
                type: string
  /services/private/ai/itemDescriptionService:
    post:
      tags:
      - Merch AI Services
      operationId: getItemDescription
      requestBody:
        content:
          '*/*':
            schema:
              type: string
      responses:
        default:
          description: default response
          content:
            '*/*':
              schema:
                type: string
  /services:
    get:
      operationId: getStatus
      parameters:
      - name: mode
        in: query
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckStatus"
            application/xml:
              schema:
                $ref: "#/components/schemas/HealthCheckStatus"
  /services/ping:
    get:
      operationId: ping
      responses:
        default:
          description: default response
          content:
            application/json: {}
            application/xml: {}
  /services/private/BusinessMetrics/getValues:
    get:
      tags:
      - Business Metrics
      summary: Get Business Metric
      description: Business Metrics GetValue service allows user to retrieve Business
        Metrics details for a given set of input parameters.
      operationId: getValues
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      - name: metricName
        in: query
        description: Metric Name
        required: true
        schema:
          type: string
      - name: timeDimension
        in: query
        description: "Time Dimension(one of these: 'H', 'D', 'W', 'M)"
        required: true
        schema:
          type: string
      - name: startDate
        in: query
        description: Start Date of metrics calculation. Metrics will be calculated
          for a period prior to the start date
        schema:
          type: string
          format: date-time
      - name: numberOfRecords
        in: query
        description: Number Of Records is the maximum count of records expected in
          the result
        schema:
          type: integer
          format: int64
      - name: aggregateMethod
        in: query
        description: "Aggregate Method is the method used to calculate the metrics(one\
          \ of these: 'AVG', 'MIN', 'MAX', 'SUM')"
        schema:
          type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/merchintegrations.services.foundation.item_tsf1_Tsf1Out_OResult"
            application/xml:
              schema:
                $ref: "#/components/schemas/merchintegrations.services.foundation.item_tsf1_Tsf1Out_OResult"
  /services/private/financials/HalfDataBudgetREST/modifyHdb:
    post:
      tags:
      - Administration - Financials
      summary: Update Half Data Budget
      description: This service allows modifications to the parameters related to
        the Half Data Budget calculations and the modified details are updated into
        the Half Data Budget table post validation.
      operationId: modifyHdb
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SvcprovHdbdesc"
          application/xml:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SvcprovHdbdesc"
      responses:
        "200":
          description: Half Data Budget processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SvcprovHdbStatusRecRDO"
            application/xml:
              schema:
                $ref: "#/components/schemas/SvcprovHdbStatusRecRDO"
  /services/private/financials/StoreDayUserREST/createStoreDayUser:
    post:
      tags:
      - Store Day Users
      summary: Create Store Day User
      description: This service is used to create store day user.
      operationId: createStoreDayUser
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SvcprovSdudesc"
          application/xml:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SvcprovSdudesc"
      responses:
        "200":
          description: Store day user create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SvcprovSduStatusRecRDO"
            application/xml:
              schema:
                $ref: "#/components/schemas/SvcprovSduStatusRecRDO"
  /services/private/financials/StoreDayUserREST/deleteStoreDayUser:
    post:
      tags:
      - Store Day Users
      summary: Delete Store Day User
      description: This service is used to delete store day user.
      operationId: deleteStoreDayUser
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SvcprovSdudesc"
          application/xml:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SvcprovSdudesc"
      responses:
        "200":
          description: Store day user create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SvcprovSduStatusRecRDO"
            application/xml:
              schema:
                $ref: "#/components/schemas/SvcprovSduStatusRecRDO"
  /services/private/financials/uploadTranData:
    post:
      tags:
      - Financials
      summary: Manage Transaction Data
      description: This service creates TRAN DATA record.
      operationId: upldTranData
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/RestTranDataRec"
          application/xml:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/RestTranDataRec"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranDataStatusRDO"
            application/xml:
              schema:
                $ref: "#/components/schemas/TranDataStatusRDO"
  /services/private/CodeDetail/codeDetails:
    get:
      tags:
      - Administration - Foundation
      summary: Get Codes and Descriptions
      description: This service is used to get codes and descriptions for a provided
        code type or a code type and code.
      operationId: getCodeDetail
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      - name: codeType
        in: query
        description: Code Type
        required: true
        schema:
          type: string
      - name: code
        in: query
        description: Code
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeDetailRecRDO"
            application/xml:
              schema:
                $ref: "#/components/schemas/CodeDetailRecRDO"
  /services/private/Common/departmentLoad:
    get:
      tags:
      - Administration - Foundation
      summary: Get Department Name
      description: This service is used to get the name for the provided department(s).
      operationId: departmentLoad
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      - name: departments
        in: query
        description: Comma separated values for Departments
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentResultRDO"
            application/xml:
              schema:
                $ref: "#/components/schemas/DepartmentResultRDO"
  /services/private/Common/departmentSearch:
    get:
      tags:
      - Administration - Foundation
      summary: Get Department Details for Department or Department Name
      description: This service is used to get departments matching the provided department
        IDs or names.
      operationId: departmentSearch
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      - name: searchString
        in: query
        description: search string for department Id or Name
        required: true
        schema:
          type: string
      - name: pageSize
        in: query
        description: Maximum number of records to retrieve per page
        schema:
          type: integer
          format: int32
          default: 25
      - name: pageNumber
        in: query
        description: Result page to retrieve
        schema:
          type: integer
          format: int32
          default: 1
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentResultRDO"
            application/xml:
              schema:
                $ref: "#/components/schemas/DepartmentResultRDO"
  /services/private/Common/Currencies:
    get:
      tags:
      - Administration - Financials
      summary: Get Currency Definitions
      description: This service is used to get currency definitions.
      operationId: getCurrencies
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Currencies"
            application/xml:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Currencies"
  /services/private/Common/FuncSysOps:
    get:
      tags:
      - Administration - System Options
      summary: Get Functional System Options
      description: "This service is used to get the Import Management, Org Units,\
        \ Supplier Sites, Contracts and Estimated Landed Cost (ELC) functional system\
        \ options, which indicate whether or not the functional area is in use."
      operationId: getFuncSysOps
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunctionalConfigOptions"
            application/xml:
              schema:
                $ref: "#/components/schemas/FunctionalConfigOptions"
  /services/private/Common/InvMovSysOps:
    get:
      tags:
      - Administration - System Options
      summary: Get Inventory Movement System Options
      description: This service is used to get inventory movement system options.
      operationId: getInvMovSysOps
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvMoveUnitOptions"
            application/xml:
              schema:
                $ref: "#/components/schemas/InvMoveUnitOptions"
  /services/private/Common/POSysOps:
    get:
      tags:
      - Administration - System Options
      summary: Get Procurement System Options
      description: This service is used to get procurement system options.
      operationId: getPOSysOps
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementUnitOptions"
            application/xml:
              schema:
                $ref: "#/components/schemas/ProcurementUnitOptions"
  /services/private/Common/vDate:
    get:
      tags:
      - Administration - Foundation
      summary: Get Current Virtual Date in Long and Date Format
      description: This service is used to get the current Merchandising virtual date
        (vdate). The date is passed out in long (epoch) format and in a date format.
      operationId: getVDate
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Period"
            application/xml:
              schema:
                $ref: "#/components/schemas/Period"
  /services/private/EowRunSignal/EowRunSignalDetail:
    get:
      tags:
      - Administration - Operations
      summary: Get POM End of Week Signal Detail
      description: This service is used to get POM End of Week Signal Detail.
      operationId: eowRunSignalDetail
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EowRunSignalRecRDO"
            application/xml:
              schema:
                $ref: "#/components/schemas/EowRunSignalRecRDO"
  /services/private/Vdate/vdateDetail:
    get:
      tags:
      - Administration - Foundation
      summary: DEPRECATED - Get Current Virtual Date in Date Format
      description: |-
        Deprecated in v23.1.401.0: Scheduled for Removal in 2 Years. Use RmsReSTServices/services/private/Common/vDate service instead.

        This service is used to get the current Merchandising virtual date (vdate). The date is passed out in date format.
      operationId: getVdateDetail
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VDate"
            application/xml:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VDate"
      deprecated: true
  /services/private/CurrencyRates/currencyRates:
    get:
      tags:
      - Administration - Financials
      summary: Get Currency Exchange Rates
      description: This service is used to retrieve all currencies and currency conversion
        rates. The conversion rate is the value used to convert to the primary currency.
      operationId: currencyRates
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurrencyRates"
            application/xml:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurrencyRates"
  /services/private/DiffIds/diffIdDetail:
    get:
      tags:
      - Items
      summary: Get Differentiator Details
      description: This service allows user to retrieve Diff description for a selected
        Diff Id.
      operationId: diffIdDetail
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      - name: diffId
        in: query
        description: Diff ID
        schema:
          type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffIdResult"
            application/xml:
              schema:
                $ref: "#/components/schemas/DiffIdResult"
  /services/private/Item/itemDetail:
    get:
      tags:
      - Items
      summary: Get Item Details
      description: This service allows user to retrieve Item information for a selected
        item.
      operationId: itemDetail
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      - name: item
        in: query
        description: Item
        schema:
          type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemDetailResult"
            application/xml:
              schema:
                $ref: "#/components/schemas/ItemDetailResult"
  /services/private/ItemlocInvDtl/itemlocInvDetail:
    get:
      tags:
      - Inventory
      summary: Get Item Location Inventory
      description: "This service allows user to retrieve Item Location and Item Location\
        \ Stock on Hand information for a selected item and location. If location\
        \ and location type are not specified, all locations for the item will be\
        \ retrieved. If location type is specified but not the location, all locations\
        \ for the item and location type will be retrieved."
      operationId: itemlocInvDetail
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      - name: item
        in: query
        description: Item
        schema:
          type: string
      - name: location
        in: query
        description: Location
        schema:
          type: integer
          format: int64
      - name: locationType
        in: query
        description: Location Type
        schema:
          type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItemLocDetailResult"
            application/xml:
              schema:
                $ref: "#/components/schemas/ItemLocDetailResult"
  /services/private/MerchHierarchy/merchHierarchy:
    get:
      tags:
      - Merchandise Hierarchy
      summary: Get Merchandise Hierarchy
      description: This service allows user to retrieve full merchandising hierarchy
        information.
      operationId: merchHierarchy
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      - name: dept
        in: query
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MerchHierarchyResult"
            application/xml:
              schema:
                $ref: "#/components/schemas/MerchHierarchyResult"
  /services/private/Reclass/reclass:
    get:
      tags:
      - Merchandise Hierarchy
      summary: Get Item Reclassification
      description: This service is used to retrieve reclassification details for a
        given item.
      operationId: reclass
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      - name: item
        in: query
        description: Item Number
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReclassResult"
            application/xml:
              schema:
                $ref: "#/components/schemas/ReclassResult"
  /services/private/Store/storeDetail:
    get:
      tags:
      - Organizational Hierarchy
      summary: Get Basic Store Details
      description: This service allows user to retrieve Store information for a selected
        store or for all stores.
      operationId: getStoreDetail
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      - name: store
        in: query
        description: Store ID. If none is specified all stores will be retrieved.
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreResult"
            application/xml:
              schema:
                $ref: "#/components/schemas/StoreResult"
  /services/private/Supplier/supplierDetail:
    get:
      tags:
      - Suppliers
      summary: Get Basic Details for Provided Supplier
      description: This service allows user to retrieve Supplier information for a
        selected supplier.
      operationId: supplierDetail
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      - name: supplierNumber
        in: query
        description: Supplier number
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierRec"
            application/xml:
              schema:
                $ref: "#/components/schemas/SupplierRec"
  /services/private/foundation/taxRules/create:
    post:
      tags:
      - Tax Rules
      summary: Create Tax Rules
      description: This REST service provides the feature to create new GTS tax rule
        within the system.
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/foundation.taxrules_create_GtsRulesConfigRec"
          application/xml:
            schema:
              $ref: "#/components/schemas/foundation.taxrules_create_GtsRulesConfigRec"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/foundation.taxrules_create_CallResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/foundation.taxrules_create_CallResponse"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /services/private/foundation/taxRules/delete:
    delete:
      tags:
      - Tax Rules
      summary: Delete Tax Rules
      description: This REST service provides the feature to remove existing GTS tax
        rule within the system.
      operationId: delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/foundation.taxrules_create_GtsRulesConfigRec"
          application/xml:
            schema:
              $ref: "#/components/schemas/foundation.taxrules_create_GtsRulesConfigRec"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/foundation.taxrules_create_CallResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/foundation.taxrules_create_CallResponse"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /services/private/foundation/taxRules/update:
    put:
      tags:
      - Tax Rules
      summary: Update tax rule
      description: This REST service provides the feature to update existing GTS tax
        rule within the system.
      operationId: update
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/foundation.taxrules_create_GtsRulesConfigRec"
          application/xml:
            schema:
              $ref: "#/components/schemas/foundation.taxrules_create_GtsRulesConfigRec"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/foundation.taxrules_create_CallResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/foundation.taxrules_create_CallResponse"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
            application/xml:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /services/private/Vat/vatDetail:
    get:
      tags:
      - Administration - Financials
      summary: Get Department Tax Details
      description: This service allows user to retrieve VAT information for a selected
        department.
      operationId: vatDetail
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      - name: department
        in: query
        description: Department Id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VatDetailResult"
            application/xml:
              schema:
                $ref: "#/components/schemas/VatDetailResult"
  /services/private/Wh/whDetail:
    get:
      tags:
      - Organizational Hierarchy
      summary: Get Basic Warehouse Details
      description: This service allows user to retrieve Warehouse information for
        a selected warehouse or for all warehouses.
      operationId: whDetail
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      - name: warehouse
        in: query
        description: Warehouse
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhResult"
            application/xml:
              schema:
                $ref: "#/components/schemas/WhResult"
  /services/private/Invadj/createInvadj:
    post:
      tags:
      - Inventory
      summary: DEPRECATED - Create Inventory Adjustment
      description: "Deprecated in v23.1.401.0: Scheduled for Removal in 2 Years. Use\
        \ MerchIntegrations/services/inventory/inventoryAdjustments/create for creating\
        \ Inventory Adjustment."
      operationId: createInvadj
      parameters:
      - $ref: "#/components/parameters/acceptLanguage"
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SvcprovInvadjdesc"
          application/xml:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/SvcprovInvadjdesc"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SvcprovInvadjStatusRecRDO"
            application/xml:
              schema:
                $ref: "#/components/schemas/SvcprovInvadjStatusRecRDO"
      deprecated: true
  /services/private/inventory/cancelFulfillOrders:
    put:
      tags:
      - Customer Orders
      summary: DEPRECATED - Cancel Fulfillment Order
      description: |-
        Deprecated in v23.1.401.0: Scheduled for Removal in 2 Years. Use MerchIntegrations/services/customerOrders/fulfillmentOrder/cancel service instead.

        Cancel an existing Customer Order or Transfer in RMS based on customer order fulfillment cancellation requests from an external Order Management System.
      operationId: cancelFulfillOrders
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/cancelfulfillorders_FulfilOrdColRef"
          application/xml:
            schema:
              $ref: "#/components/schemas/cancelfulfillorders_FulfilOrdColRef"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/cancelfulfillorders_InvocationSuccess"
            application/xml:
              schema:
