          description: Contains a number which identifies the reason for the cost
            change.  The number can be decoded on the cost_chg_reason table.
          format: int32
          example: 6
        activeDate:
          type: string
          description: Contains the date in which the cost change will become active.
            Format should be YYYY-MM-DD.
          format: date
        status:
          type: string
          description: "Contains the status of the cost change.  Valid values are:\
            \ W = Worksheet, D = Deleted (to be deleted), C = Canceled, A = Approved,\
            \ E = Extracted, R = Rejected, S = Submitted"
          example: A
          enum:
          - W
          - D
          - C
          - A
          - E
          - R
          - S
        costChangeOrigin:
          type: string
          description: "Contains a code which identifies the origin of the cost change.\
            \  This code is used to determine whether the event was created by supplier\
            \ or by SKU.  Cost events with a supplier origin will have multiple detail\
            \ records all having the same supplier.  Cost events with a SKU origin\
            \ will have multiple detail records which may have multiple SKUs and multiple\
            \ suppliers.  Valid Values are: SUP - By Supplier, SKU - By SKU"
          example: SKU
          enum:
          - SKU
          - SUP
        approvalId:
          type: string
          description: Contains the user ID of the person who last approved the cost
            change.
          example: SomeUser
        suppItemDetails:
          type: array
          items:
            $ref: "#/components/schemas/createcostchange_SvcprovCostSuspSupDetail"
        suppItemLocDetails:
          type: array
          items:
            $ref: "#/components/schemas/createcostchange_SvcprovCostSuspSupDetailLoc"
        customFlexAttribute:
          type: array
          items:
            $ref: "#/components/schemas/createcostchange_SvcprovCostSuspSupHeadCfa"
      xml:
        name: svcprovCostSuspSupHead
    createcostchange_SvcprovCostSuspSupHeadCfa:
      type: object
      properties:
        action:
          type: string
          description: "Describes type of action i.e. NEW, MOD or DEL"
          enum:
          - NEW
          - MOD
          - DEL
        cfaName:
          type: string
          example: ""
        cfaValue:
          type: string
          example: ""
        cfaValueDate:
          type: string
          description: Format of the date should be YYYY-MM-DD
          format: date
      xml:
        name: svcprovCostSuspSupHeadCfa
