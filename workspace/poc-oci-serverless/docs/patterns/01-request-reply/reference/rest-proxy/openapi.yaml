    foundation.taxrules_create_GtsRulesConfigRec:
      type: object
      properties:
        ruleId:
          type: integer
          description: Tax rule unique ID.
          format: int32
          example: 919875
        ruleName:
          maxLength: 300
          minLength: 0
          type: string
          description: Tax Rule Name.
          example: String
        taxRegionSource:
          type: integer
          description: Source Tax Region.
          format: int32
          example: 1000
        taxRegionDestination:
          type: integer
          description: Destination Tax Region.
          format: int32
          example: 1000
        activeDate:
          pattern: "|([0-9]{4})-(1[0-2]|0[1-9])-(3[01]|0[1-9]|[12][0-9])"
          type: string
          description: Effective date when this tax rule become active.
          format: date
        endDate:
          pattern: "|([0-9]{4})-(1[0-2]|0[1-9])-(3[01]|0[1-9]|[12][0-9])"
          type: string
          description: End date when this tax rule expired.
          format: date
        status:
          maxLength: 6
          minLength: 0
          type: string
          description: "Status of the Rule. Code Detail 'GTST'. Valid Values are 'AC'\
            \ for Active, 'AP' for Approved, 'O' Obsoleted, 'S' for Submitted, 'U'\
            \ for Updated, 'W' for Worksheet ."
          example: String
        taxCode:
          maxLength: 6
          minLength: 0
          type: string
          description: Tax code.
          example: String
        taxCalcType:
          maxLength: 6
          minLength: 0
          type: string
          description: Define the tax calculation type. Possible values are 'P'ercentage
            or 'U'nit'..Code detail 'GTTT'.
          example: String
        taxRate:
          type: number
          description: Tax rate in percentage when tax calculation type is in percentage.
          example: 15.0
        taxBasisType:
          maxLength: 6
          minLength: 0
          type: string
          description: "Indicate which value is used as base calculation to apply\
            \ tax. It should be: UNIT_'C'OST, UNIT_'R'ETAIL, 'B'OTH, 'N'ON_MERCH_COST.\
            \ Code detail 'GTTB'."
          example: String
        taxBasisFactor:
          type: number
          description: Contains a unique user specified code representing the non-merchandise
            code.
          example: 11.0
        nonMerchCode:
          maxLength: 6
          minLength: 0
          type: string
          description: UOM type selected to be considered when tax calculation is
            in unit.
          example: String
        uomType:
          maxLength: 4
          minLength: 0
          type: string
          description: UOM value selected to be considered when tax calculation is
            in unit.
          example: ????
        uomValue:
          type: number
          description: Tax value when tax calculation type is in per unit.
          example: 68.0
        currencyCode:
          maxLength: 3
          minLength: 0
          type: string
          description: Contains the currency code for the tax rule. For unit tax application.
          example: ???
        reverseTaxInd:
          maxLength: 1
          minLength: 0
          type: string
          description: "Reverse Tax Indicator: Y Enable N Disable. Code detail 'YSNO'."
          example: '?'
        reverseTaxThreshold:
          type: number
          description: Threshold amount to be taken in consideration while returning
            the tax code. It will have value when REVERSE_TAX_IND is Y.
          example: 19.0
        predecessorTaxRulesId:
          type: integer
          description: Holds the predecessor rule ID that the result of the tax calculated
            in the predecessor rule will be added to the tax basis of the current
            rule in order to address Tax over Tax calculation requirement.
          format: int32
          example: 514301
        regionExplodeType:
          maxLength: 6
          minLength: 0
          type: string
          description: Tax over tax rate calculated based in predecessor tax rule
            when applied.
          example: String
        gtsRulesConfigTlTbl:
          type: array
          description: Translation records associated with tax record.
          items:
            $ref: "#/components/schemas/foundation.taxrules_create_GtsRulesConfigTlTbl"
        gtsRulesConditionsTbl:
          type: array
          description: Conditions associated with tax record.
          items:
            $ref: "#/components/schemas/foundation.taxrules_create_GtsRulesConditionsTbl"
        gtsRulesCfaTbl:
          type: array
          description: Rules restrictions associated with tax record.
          items:
            $ref: "#/components/schemas/foundation.taxrules_create_GtsRulesCfaTbl"
      xml:
        name: GtsRulesConfigRec
