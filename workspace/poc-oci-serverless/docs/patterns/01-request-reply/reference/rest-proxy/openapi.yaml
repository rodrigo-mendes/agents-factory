      type: object
      properties:
        customerOrderNo:
          type: string
          description: Holds the master customer order number from OMS.
          example: "12342132156"
        fulfillOrderNo:
          type: string
          description: Unique number from OMS related to the fulfillment details.
            One or more fulfillment orders could relate back to a single customer
            order in OMS.
          example: "123123213"
        sourceLocType:
          type: string
          description: "This would be either 'SU' for supplier, 'ST' for store, or\
            \ 'WH' for warehouse. This would only be populated for vendor, warehouse\
            \ or multi-site fulfillment orders."
          example: ST
          enum:
          - SU
          - ST
          - WH
        sourceLocId:
          type: integer
          description: "Indicates the supplier, store or warehouse number associated\
            \ with sourcing the customer order. Only populated for vendor, warehouse\
            \ or multi-site fulfillment orders."
          format: int32
          example: 6000
        fulfillLocType:
          type: string
          description: This would be either 'S' (for physical store) or 'V' (for virtual
            store).
          example: S
          enum:
          - S
          - V
        fulfillLocId:
          type: integer
          description: "Indicates the store or warehouse number associated with fulfilling\
            \ the customer order. For this release, this should always be populated\
            \ with a virtual or physical store number."
          format: int32
          example: 1311
        partialDeliveryInd:
          type: string
          description: Indicates if the order can be picked and shipped partially
            ('N') or if it should be shipped only when complete ('Y').
          example: "N"
          enum:
          - "Y"
          - "N"
        deliveryType:
          type: string
          description: Indicates the fulfillment method - ship to customer or store
            pickup. Expected values are 'S' (ship direct) and 'C' (customer pickup).
          example: S
          enum:
          - S
          - C
        carrierCode:
          type: string
          description: "Indicates the carrier the order is to be shipped with, if\
            \ specified on the order."
          example: "30"
        carrierServiceCode:
          type: string
          description: "Indicates the method that was selected for shipping by the\
            \ customer placing the order (e. g. Standard Shipping, Overnight, etc.\
            \ )."
          example: D
        consumerDeliveryDate:
          type: string
          description: Indicates the desired date the delivery is required by the
            customer. This will be the GMT time.
          format: date
        consumerDeliveryTime:
          type: string
          description: Indicates the desired time the delivery is required by the
            customer. This will be the GMT time.
          format: date-time
        deliveryCharges:
          type: number
          description: Contains the delivery charges on drop ship. Mostly relevant
            for Brazil.
          example: 3
        deliveryChargesCurrency:
          type: string
          description: Contains the currency of the delivery charges.
          example: USD
        comments:
          type: string
          description: Any comments sent by OMS about the order.
          example: commentDesc
        customerDetail:
          $ref: "#/components/schemas/createfulfillorders_FulfilOrdCustDesc"
        orderDetails:
          type: array
          description: References a collection of customer order fulfillment details.
          items:
            $ref: "#/components/schemas/createfulfillorders_FulfilOrdDtl"
        orderPlacedStore:
          type: integer
          description: Indicates the store number associated with the location that
            the customer order was placed. For on-line orders this will contain the
            virtual store number associated with the on-line store. For orders captured
            in a physical store this will contain the store number for the physical
            store.
          format: int32
          example: 1311
      description: Array of fulfillment order
      xml:
        name: fulfilOrdDesc
    createfulfillorders_FulfilOrdDtl:
      required:
      - item
      - orderQtySuom
      - substituteInd
      type: object
      properties:
        item:
          type: string
          description: Indicates the item ordered by the customer.
          example: "101450060"
        referenceItem:
          type: string
          description: Indicates the reference item ordered by the customer. Used
            only if a specific UPC is ordered. This is supported for vendor drop-ships
            orders only as we don't support transfer requests for a specific reference
            item.
          example: ""
        orderQtySuom:
          type: number
          description: Indicates the quantity of the item ordered by the customer
            in item's standard unit of measure.
          example: 3
        standardUom:
          type: string
          description: Indicates item's standard unit of measure.
          example: EA
        transactionUom:
          type: string
          description: Indicates the original transaction unit of measure the order
            is placed in.
          example: EA
        substituteInd:
          type: string
          description: Indicates if substitutes are allowed on a customer order. This
            will only be used by orders passed to SIM.
          example: "N"
        unitRetail:
          type: number
          description: Indicates the unit sales retail of item on the customer order.
            This will only be used by Brazil orders in case of Warehouse Fulfillment
            or vendor sourced POs shipped directly to the customer. It is needed for
            Sales NF generation.
          example: 12
        retailCurrrency:
          type: string
          description: Indicates currency of unit retail and total retail. This will
            only be used by Brazil orders in case of Warehouse Fulfillment or vendor
            sourced POs shipped directly to the customer. It is needed for Sales NF
            generation.
          example: USD
        comments:
          type: string
          description: "Used to indicate any special instructions for the item, such\
            \ as services (monograms, engrave, etc)."
          example: commentDesc
        itemLineNo:
          type: integer
          description: Indicates the detail item line number on the order.
          format: int32
          example: 1
      description: References a collection of customer order fulfillment details.
      xml:
        name: fulfilOrdDtl
