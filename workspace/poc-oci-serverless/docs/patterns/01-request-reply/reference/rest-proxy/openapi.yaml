    createcostchange_SvcprovCostSuspSupDetail:
      type: object
      properties:
        action:
          type: string
          description: "Describes type of action i.e. NEW, MOD or DEL"
          example: NEW
          enum:
          - NEW
          - MOD
          - DEL
        supplier:
          type: integer
          description: Contains the number which identifies the supplier associated
            with the cost change.
          format: int32
          example: 60000
        originCountryId:
          type: string
          description: The country where the item was manufactured or significantly
            altered.
          example: US
        item:
          type: string
          description: Unique alphanumeric value that identifies the item
          example: "103500024"
        bracketValue1:
          type: number
          description: The values are the various levels in the vendor price list
            whereby costing of the items will be affected as the levels are achieved
            on the Purchase Orders.
        costChangeType:
          type: string
          description: "Describes the type of cost change. Valid values are A - Amount,\
            \ P - Percentage and F - Fixed Price"
          example: F
          enum:
          - A
          - P
          - F
        costChangeValue:
          type: number
          description: Holds the value of cost_change
          example: 19
        recalcOrdInd:
          type: string
          description: "This field indicates whether or not approved order costs should\
            \ be re-calculated when a supplier cost has changed.  Valid values are:\
            \ Y - Yes, recalculate order, N - No, do no recalculate order"
          example: "N"
          enum:
          - "Y"
          - "N"
        defaultBracketInd:
          type: string
          description: "This field contains the value which will control which cost\
            \ is the base cost for processing throughout the system.  Each bracket\
            \ group (either by supplier, supplier/department, supplier/department/location,\
            \ supplier/location) must have one bracket defined as the default bracket."
          example: ""
        calculationBasis:
          type: string
          description: "This indicates if the cost for the consignment/concession\
            \ item will be managed either based on cost per unit or as a percentage\
            \ of retail. Valid values are C - Cost per Unit, P - Purchase Rate."
          example: ""
          enum:
          - C
          - P
        purchaseRate:
          type: number
          description: This column contains the percentage of the retail price which
            will determine the cost paid to the supplier for a consignment or concession
            item.
      xml:
        name: svcprovCostSuspSupDetail
