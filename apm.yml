name: agents-factory
version: 1.0.0
description: AI artifact factory (skills, subagents, rules) with an anti-hallucination focus
author: rodrigo-mendes
license: MIT
dependencies:
  apm:
    # factory-core and research-core are NOT listed directly here — every
    # package below already depends on factory-core (and the 3 research
    # packages on research-core too), so they resolve transitively. Listing
    # them again here would give APM two different textual paths
    # (./packages/X here vs ../X from the siblings) for the SAME physical
    # package, which `apm audit --ci` rejects as "ambiguous resolved_by"
    # (confirmed, CLI v0.31.0) — this is not cosmetic, the audit fails.
    - path: ./packages/factory/researching-frameworks
    - path: ./packages/factory/researching-platform
    - path: ./packages/factory/artifact-authoring
    - path: ./packages/harness-quality/auditing
    - path: ./packages/harness-quality/validating
    - path: ./packages/harness-quality/evaluating
    - path: ./packages/content-generation/book-writing
    # camel-quarkus-skills is NOT listed directly: camel-quarkus-integrator
    # depends on ../camel-quarkus-skills, so it resolves transitively (same
    # "ambiguous resolved_by" reason as factory-core above).
    - path: ./packages/java/quarkus/camel-quarkus-integrator
    - path: ./packages/factory/agent-package-builder
    # aws-skills and oci-core are NOT listed directly: aws-saas-serverless-quarkus-react-nextjs (via
    # aws-architect) and the oci-* packages depend on them, so they resolve transitively (same "ambiguous
    # resolved_by" reason as factory-core above).
    - path: ./packages/cloud/provider/oci/oci-functions-java
    - path: ./packages/cloud/terraform/oci-terraform
    - path: ./packages/cloud/provider/oci/oci-observability
    - path: ./packages/cloud/provider/oci/oci-architecture
    - path: ./packages/java/libs/langchain4j
    # aws-saas-serverless-quarkus-react-nextjs pulls in quarkus-aws, aws-lambda, aws-observability,
    # handoff-core (and through them quarkus-core, aws-skills, aws-terraform),
    # plus aws-architect, terraform and stripe-java. Those three are therefore
    # NOT listed directly any more (same "ambiguous resolved_by" reason as
    # factory-core above); they still install, transitively.
    - path: ./packages/saas/aws-saas-serverless-quarkus-react-nextjs
    # vercel-frontend, github-actions-cicd, solution-architecture, ui-design, nextjs-frontend and
    # quarkus-langchain4j are NOT listed directly: aws-saas-serverless-quarkus-react-nextjs depends
    # on them, so they resolve transitively (same "ambiguous resolved_by" reason as factory-core).
#    - git: microsoft/apm
  mcp: []
includes: auto
scripts: {}
# NOTE: `apm lifecycle trust` + this post-install block did NOT auto-fire during
# `apm install` in testing (CLI v0.31.0) despite being trusted and validated —
# confirmed via `apm lifecycle test post-install` (shows as armed) vs. a real
# `apm install` run (no lifecycle phase logged, scripts never executed). Kept
# here in case a future CLI version honors it, but DO NOT rely on it: run both
# scripts explicitly after every `apm install` (see CLAUDE.md).
lifecycle:
  post-install:
    - type: command
      description: "Restore name:/description: on .claude/rules/*.md if a future APM version drops them again (defensive; did not reproduce in this repo's real install — see scripts/restore-rule-metadata.py docstring)."
      command: "python3 scripts/restore-rule-metadata.py"
      timeoutSec: 30
    - type: command
      description: "Fix within-package markdown links APM rewrites into apm_modules/ paths (confirmed bug, v0.31.0). See scripts/fix-cross-package-links.py."
      command: "python3 scripts/fix-cross-package-links.py"
      timeoutSec: 30
